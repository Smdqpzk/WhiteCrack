<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>白色夾縫</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <canvas id="game"></canvas>

    <div id="hud">

        <div class="hud-top">

            <div>
                ❤️
                <span id="hp">100</span>
                /
                <span id="maxHp">100</span>
            </div>

            <div>
                🪙
                <span id="gold">0</span>
            </div>

            <div id="soul">
                ☀️ 陽相
            </div>

        </div>

        <div class="memory">
            記憶：
            <span id="memoryCount">0</span>
        </div>

        <div class="inventory">
            背包：
            <span id="inventoryText">空</span>
        </div>

    </div>


    <div id="interaction"></div>


    <div id="dialogue">

        <div id="dialogue-speaker"></div>

        <div id="dialogue-text"></div>

        <div id="dialogue-next">
            SPACE / ENTER
        </div>

    </div>


    <div id="help">

        WASD / 方向鍵：移動
       　
        Q：切換靈魂
       　
        E：互動
       　
        SPACE：攻擊
       　
        F：引魂燈
       　
        K：儲存
       　
        L：讀取

    </div>


    <script type="module" src="game.js"></script>

</body>

</html>
